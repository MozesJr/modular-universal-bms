# =============================================================
# Modular Universal BMS — Docker Compose (VPS Production)
# MongoDB  : container sendiri (bukan master_mongodb eksternal)
# Dashboard: :8282  | Backend: :3100  | MQTT: :1885
# =============================================================

services:

  # ─── 1. MongoDB ───────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: bms_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    volumes:
      - mongo_data:/data/db
      - ./mongo/init/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - bms_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 2. Mosquitto MQTT Broker ─────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: bms_mosquitto
    restart: unless-stopped
    ports:
      - "1885:1883"   # Host 1885 → Container 1883 (ESP32 connect ke port 1885)
      - "9002:9001"   # Host 9002 → Container 9001 (WebSocket, opsional)
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - bms_network
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "health", "-m", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 3. Backend — Node.js + Express ──────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bms_backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB_NAME}?authSource=admin
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-bms}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3100:3000"   # Host 3100 → Container 3000
    depends_on:
      mongo:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - bms_network

  # ─── 4. Frontend — React (Vite) via Nginx ─────────────────
  frontend:
    build:
      context: ./new-frontend
      dockerfile: Dockerfile
    container_name: bms_frontend
    restart: unless-stopped
    ports:
      - "8080:80"   # Host 8282 → Container 80 (Nginx serves React app + proxies /api & /socket.io to backend)
    depends_on:
      - backend
    networks:
      - bms_network

# ─── Volumes ──────────────────────────────────────────────
volumes:
  mongo_data:
    driver: local
  mosquitto_data:
    driver: local
  mosquitto_log:
    driver: local

# ─── Networks ─────────────────────────────────────────────
networks:
  bms_network:
    driver: bridge