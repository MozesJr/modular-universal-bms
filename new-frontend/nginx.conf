# Modular Universal BMS — frontend nginx config
#
# Serves the built React SPA and reverse-proxies API/WebSocket traffic to
# the backend container by its Docker Compose service name ("backend"), so
# the browser only ever talks to this one origin — no CORS, no hardcoded
# backend domain/IP baked into the frontend bundle.

# Normalizes the Connection header for the socket.io proxy: "upgrade" when
# the client is asking for a WebSocket, "close" for plain HTTP (long-poll).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        application/wasm
        image/svg+xml;

    # REST API -> backend service
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO -> backend service (needs the WebSocket upgrade headers;
    # long-polling fallback works through the same location too)
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Hashed static assets (Vite content-hashes filenames) can be cached
    # aggressively — a new deploy ships new filenames, not new content
    # under the old name.
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|ico)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React Router (BrowserRouter) — let the client-side router handle any
    # path that isn't a real file, instead of nginx 404ing on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
